# Hallway air conditioner: Panasonic CS-E24GKR driven from an ESP-01M (ESP8285) IR board.
# IR LED on GPIO4, IR receiver (e.g. VS1838B) on GPIO14, so Home Assistant follows the original remote.

esphome:
  name: hallway-air-conditioner

esp8266:
  board: esp01_1m

logger:
  level: INFO # INFO leaves debug strings out of the build; a 1 MB flash is tight for OTA

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://scottbambrick/esphome-panasonic-dke
    components: [panasonic_dke]

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO14
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 25%
  buffer_size: 4kb
  idle: 20ms
  filter: 100us

sensor:
  # Room temperature from Home Assistant (the AC unit has no sensor we can read)
  - platform: homeassistant
    id: room_temperature
    entity_id: sensor.lounge_room_environment_sensor_temperature
    internal: true

climate:
  - platform: panasonic_dke
    name: "Air Conditioner"
    sensor: room_temperature
    receiver_id: ir_receiver
    vertical_swing:
      name: "Vertical louvre"
    horizontal_swing:
      name: "Horizontal louvre"
    air_purifier:
      name: "Air purifier"
